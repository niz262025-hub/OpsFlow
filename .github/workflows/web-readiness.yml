name: OpsFlow web and SSO contract checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/test-supabase-gateway.mjs
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx expo export --platform web --output-dir dist
  sso-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt httpx==0.27.2
      - run: python -m unittest backend.tests.test_myops_app_access backend.tests.test_vercel_api backend.tests.test_preview_transport backend.tests.test_sso_readiness -v
